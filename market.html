<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Crypto Gamers</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Same styles as before - keeping them concise for brevity */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141f;
            --bg-card: #1a1a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --primary: #ff2a6d;
            --primary-dark: #d91a5c;
            --secondary: #7a4fff;
            --success: #00ff88;
            --warning: #ffd166;
            --danger: #ff6b6b;
            --border: #2a2a3a;
            --input-bg: #1e1e2e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Navigation */
        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 42, 109, 0.1);
            color: var(--primary);
        }

        .nav-link i {
            margin-right: 8px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .create-store-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .create-store-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 42, 109, 0.3);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--primary);
            cursor: pointer;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 30px;
        }

        /* Header */
        .market-header {
            margin-bottom: 30px;
        }

        .market-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .market-header p {
            color: var(--text-secondary);
        }

        /* Search and Filters */
        .search-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filter-btn {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-tag {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .category-tag:hover, .category-tag.active {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 42, 109, 0.2);
            border-color: var(--primary);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-secondary);
        }

        .product-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .product-discount {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--success);
            color: black;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .product-info {
            padding: 15px;
        }

        .product-store {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .product-store i {
            color: var(--primary);
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            margin-bottom: 10px;
        }

        .current-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .original-price {
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: line-through;
            margin-left: 8px;
        }

        .product-features {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }

        .feature-tag {
            background: var(--bg-secondary);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .feature-tag i {
            color: var(--primary);
            font-size: 10px;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .seller-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .seller-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-secondary);
            object-fit: cover;
        }

        .seller-name {
            font-size: 13px;
            font-weight: 500;
        }

        .connect-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .connect-btn i {
            font-size: 14px;
        }

        .connect-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }

        .connect-btn.telegram {
            background: linear-gradient(135deg, #0088cc, #0077b5);
        }

        /* Loading Skeleton */
        .loading-skeleton {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .skeleton-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-card) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        .skeleton-text {
            height: 16px;
            background: var(--bg-secondary);
            margin: 10px;
            border-radius: 4px;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 60px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .empty-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        /* Offline Indicator */
        .offline-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--danger);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .container {
                padding: 0 15px;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
            
            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">CryptoGamers</a>
            
            <div class="nav-links">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
                <a href="gamers.html" class="nav-link"><i class="fas fa-users"></i> Gamers</a>
                <a href="market.html" class="nav-link active"><i class="fas fa-store"></i> Market</a>
                <a href="xp.html" class="nav-link"><i class="fas fa-trophy"></i> XP</a>
            </div>

            <div class="user-menu">
                <a href="create-store.html" class="create-store-btn" id="createStoreBtn">
                    <i class="fas fa-plus"></i> Open Store
                </a>
                <a href="profile.html" id="profileLink">
                    <img src="discord.jpg" alt="Profile" class="user-avatar" id="userAvatar">
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="market-header">
            <h1>Marketplace</h1>
            <p>Discover amazing products from gamers around the world</p>
        </div>

        <!-- Search and Filters -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Search products...">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="new">New</button>
                <button class="filter-btn" data-filter="discount">On Sale</button>
            </div>

            <div class="categories" id="categories">
                <span class="category-tag active" data-category="all">All</span>
                <span class="category-tag" data-category="gaming-gear">Gaming Gear</span>
                <span class="category-tag" data-category="digital-goods">Digital Goods</span>
                <span class="category-tag" data-category="game-accounts">Game Accounts</span>
                <span class="category-tag" data-category="in-game-items">In-Game Items</span>
                <span class="category-tag" data-category="services">Services</span>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <!-- Offline Indicator -->
    <div class="offline-indicator" id="offlineIndicator">
        <i class="fas fa-wifi"></i>
        You are offline. Showing cached products.
    </div>

    <!-- Firebase Scripts - Using the same pattern as your gamers.js -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase configuration - same as your gamers.js
        const firebaseConfig = {
            apiKey: "AIzaSyC9jF-ocy6HjsVzWVVlAyXW-4aIFgA79-A",
            authDomain: "crypto-6517d.firebaseapp.com",
            projectId: "crypto-6517d",
            storageBucket: "crypto-6517d.firebasestorage.app",
            messagingSenderId: "60263975159",
            appId: "1:60263975159:web:bd53dcaad86d6ed9592bf2"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const productsGrid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const categoryTags = document.querySelectorAll('.category-tag');
        const createStoreBtn = document.getElementById('createStoreBtn');
        const userAvatar = document.getElementById('userAvatar');
        const offlineIndicator = document.getElementById('offlineIndicator');

        // State
        let allProducts = [];
        let filteredProducts = [];
        let currentFilter = 'all';
        let currentCategory = 'all';
        let currentUser = null;
        let isOnline = navigator.onLine;

        // Network monitoring
        window.addEventListener('online', () => {
            isOnline = true;
            offlineIndicator.style.display = 'none';
            loadProducts(true);
        });

        window.addEventListener('offline', () => {
            isOnline = false;
            offlineIndicator.style.display = 'flex';
            loadCachedProducts();
        });

        // Check authentication
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                updateUserUI(user);
            }
            loadProducts();
        });

        function updateUserUI(user) {
            if (user.photoURL) {
                userAvatar.src = user.photoURL;
            }
        }

        // Load products from Firestore
        async function loadProducts(forceRefresh = false) {
            if (!isOnline && !forceRefresh) {
                loadCachedProducts();
                return;
            }

            try {
                showLoading();

                const productsRef = collection(db, 'products');
                const q = query(productsRef, orderBy('createdAt', 'desc'));
                const querySnapshot = await getDocs(q);

                allProducts = [];
                querySnapshot.forEach((doc) => {
                    allProducts.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                console.log(`Loaded ${allProducts.length} products`);

                // Cache products
                cacheProducts(allProducts);

                filterAndDisplayProducts();

            } catch (error) {
                console.error('Error loading products:', error);
                loadCachedProducts();
            }
        }

        function cacheProducts(products) {
            try {
                localStorage.setItem('cached_products', JSON.stringify({
                    data: products,
                    timestamp: Date.now()
                }));
            } catch (error) {
                console.log('Cache error:', error);
            }
        }

        function loadCachedProducts() {
            try {
                const cached = localStorage.getItem('cached_products');
                if (cached) {
                    const { data } = JSON.parse(cached);
                    allProducts = data;
                    filterAndDisplayProducts();
                    
                    if (!isOnline) {
                        offlineIndicator.style.display = 'flex';
                    }
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.log('Error loading cache:', error);
                showEmptyState();
            }
        }

        function showLoading() {
            productsGrid.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                productsGrid.innerHTML += `
                    <div class="loading-skeleton">
                        <div class="skeleton-image"></div>
                        <div class="skeleton-text" style="width: 80%;"></div>
                        <div class="skeleton-text" style="width: 60%;"></div>
                        <div class="skeleton-text" style="width: 40%;"></div>
                    </div>
                `;
            }
        }

        function showEmptyState() {
            productsGrid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <h3>No Products Yet</h3>
                    <p>Be the first to list a product in the marketplace!</p>
                    <a href="create-store.html" class="empty-btn">
                        <i class="fas fa-store"></i> Open a Store
                    </a>
                </div>
            `;
        }

        function filterAndDisplayProducts() {
            // Apply category filter
            if (currentCategory !== 'all') {
                filteredProducts = allProducts.filter(p => p.category === currentCategory);
            } else {
                filteredProducts = [...allProducts];
            }

            // Apply main filter
            switch(currentFilter) {
                case 'new':
                    filteredProducts = filteredProducts.slice(0, 20);
                    break;
                case 'discount':
                    filteredProducts = filteredProducts.filter(p => p.discount > 0);
                    break;
            }

            // Apply search
            const searchTerm = searchInput.value.toLowerCase().trim();
            if (searchTerm) {
                filteredProducts = filteredProducts.filter(p => 
                    (p.name && p.name.toLowerCase().includes(searchTerm)) ||
                    (p.description && p.description.toLowerCase().includes(searchTerm)) ||
                    (p.storeName && p.storeName.toLowerCase().includes(searchTerm))
                );
            }

            displayProducts();
        }

        function displayProducts() {
            if (filteredProducts.length === 0) {
                productsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>No Products Found</h3>
                        <p>Try adjusting your filters or search term</p>
                    </div>
                `;
                return;
            }

            productsGrid.innerHTML = filteredProducts.map(product => createProductCard(product)).join('');

            // Add click events to product cards
            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.connect-btn')) {
                        window.location.href = `product.html?id=${card.dataset.productId}`;
                    }
                });
            });

            // Add connect button events
            document.querySelectorAll('.connect-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const whatsapp = btn.dataset.whatsapp;
                    const telegram = btn.dataset.telegram;
                    const platform = btn.classList.contains('telegram') ? 'telegram' : 'whatsapp';
                    
                    if (platform === 'whatsapp' && whatsapp) {
                        window.open(`https://wa.me/${whatsapp.replace('+', '')}`, '_blank');
                    } else if (platform === 'telegram' && telegram) {
                        window.open(`https://t.me/${telegram.replace('@', '')}`, '_blank');
                    }
                });
            });
        }

        function createProductCard(product) {
            const hasDiscount = product.discount > 0;
            
            // Get image URL - handle both string URLs and Cloudinary objects
            let imageUrl = 'discord2.jpg';
            
            if (product.images && product.images.length > 0) {
                if (typeof product.images[0] === 'object' && product.images[0].url) {
                    // Cloudinary object with url property
                    imageUrl = product.images[0].thumbnail || product.images[0].url;
                } else if (typeof product.images[0] === 'string') {
                    // Direct URL string
                    imageUrl = product.images[0];
                }
            }

            return `
                <div class="product-card" data-product-id="${product.productId || product.id}">
                    <img src="${imageUrl}" alt="${product.name || 'Product'}" class="product-image" 
                         onerror="this.src='discord2.jpg'">
                    
                    ${product.status === 'new' ? '<span class="product-badge">NEW</span>' : ''}
                    ${hasDiscount ? `<span class="product-discount">-${product.discount}%</span>` : ''}
                    
                    <div class="product-info">
                        <div class="product-store">
                            <i class="fas fa-store"></i> ${product.storeName || 'Store'}
                        </div>
                        
                        <h3 class="product-name">${product.name || 'Unnamed Product'}</h3>
                        
                        <div class="product-price">
                            <span class="current-price">$${product.salePrice || product.price || '0.00'}</span>
                            ${hasDiscount ? `<span class="original-price">$${product.originalPrice || product.price}</span>` : ''}
                        </div>
                        
                        ${product.features && product.features.length > 0 ? `
                            <div class="product-features">
                                ${product.features.slice(0, 3).map(feature => `
                                    <span class="feature-tag">
                                        <i class="fas fa-check"></i> ${feature.replace('-', ' ')}
                                    </span>
                                `).join('')}
                            </div>
                        ` : ''}
                        
                        <div class="product-footer">
                            <div class="seller-info">
                                <img src="images/default-avatar.jpg" alt="${product.ownerName || 'Seller'}" class="seller-avatar"
                                     onerror="this.src='images/default-avatar.jpg'">
                                <span class="seller-name">${product.ownerName || 'Seller'}</span>
                            </div>
                            
                            <div style="display: flex; gap: 5px;">
                                ${product.ownerWhatsapp ? `
                                    <button class="connect-btn" data-whatsapp="${product.ownerWhatsapp}" title="Contact on WhatsApp">
                                        <i class="fab fa-whatsapp"></i>
                                    </button>
                                ` : ''}
                                
                                ${product.ownerTelegram ? `
                                    <button class="connect-btn telegram" data-telegram="${product.ownerTelegram}" title="Contact on Telegram">
                                        <i class="fab fa-telegram"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Event Listeners
        searchInput.addEventListener('input', debounce(() => {
            filterAndDisplayProducts();
        }, 300));

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                filterAndDisplayProducts();
            });
        });

        categoryTags.forEach(tag => {
            tag.addEventListener('click', () => {
                categoryTags.forEach(t => t.classList.remove('active'));
                tag.classList.add('active');
                currentCategory = tag.dataset.category;
                filterAndDisplayProducts();
            });
        });

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Initial load
        loadProducts();
    </script>
</body>
</html>
