<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - Crypto Gamers</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141f;
            --bg-card: #1a1a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --primary: #ff2a6d;
            --primary-dark: #d91a5c;
            --secondary: #7a4fff;
            --success: #00ff88;
            --warning: #ffd166;
            --danger: #ff6b6b;
            --border: #2a2a3a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Navigation */
        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 42, 109, 0.1);
            color: var(--primary);
        }

        .nav-link i {
            margin-right: 8px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .create-store-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .create-store-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 42, 109, 0.3);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--primary);
            cursor: pointer;
            object-fit: cover;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 30px;
        }

        /* Back Button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(-5px);
        }

        /* Store Header */
        .store-header {
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .store-cover {
            height: 200px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            position: relative;
            overflow: hidden;
        }

        .store-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><path d="M20 20 L80 20 L80 80 L20 80 Z" fill="none" stroke="white" stroke-width="2"/><circle cx="50" cy="50" r="20" fill="none" stroke="white" stroke-width="2"/></svg>');
            background-size: 50px;
        }

        .store-info {
            padding: 30px;
            position: relative;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .store-logo {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            border: 4px solid var(--primary);
            background: var(--bg-secondary);
            object-fit: cover;
            margin-top: -60px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .store-details {
            flex: 1;
        }

        .store-name {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .store-badge {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .store-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .store-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .store-meta-item i {
            color: var(--primary);
        }

        .store-description {
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
        }

        .store-stats {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .store-actions {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .contact-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .contact-btn.whatsapp {
            background: linear-gradient(135deg, #25D366, #128C7E);
        }

        .contact-btn.telegram {
            background: linear-gradient(135deg, #0088cc, #0077b5);
        }

        .contact-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 20px;
        }

        .tab:hover {
            color: var(--primary);
            background: rgba(255, 42, 109, 0.1);
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 42, 109, 0.2);
            border-color: var(--primary);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--bg-secondary);
        }

        .product-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .product-discount {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--success);
            color: black;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .current-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .original-price {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        .product-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .product-meta i {
            color: var(--primary);
            margin-right: 3px;
        }

        /* About Section */
        .about-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .about-title {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .about-title i {
            color: var(--primary);
        }

        .about-text {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .policies-section {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .policies-title {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .policies-text {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        /* Contact Info */
        .contact-info {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .contact-title {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-title i {
            color: var(--primary);
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 42, 109, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
        }

        .contact-detail {
            flex: 1;
        }

        .contact-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .contact-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .contact-action {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .contact-action:hover {
            text-decoration: underline;
        }

        /* Loading State */
        .loading-skeleton {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .skeleton-logo {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-card) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            margin-top: -60px;
            margin-bottom: 20px;
        }

        .skeleton-text {
            height: 20px;
            background: var(--bg-secondary);
            margin: 10px 0;
            border-radius: 4px;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 50px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .store-info {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .store-logo {
                margin-top: -60px;
            }
            
            .store-meta {
                justify-content: center;
            }
            
            .store-stats {
                justify-content: center;
            }
            
            .store-actions {
                width: 100%;
                justify-content: center;
            }
            
            .tabs {
                overflow-x: auto;
                padding-bottom: 10px;
            }
            
            .tab {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">CryptoGamers</a>
            
            <div class="nav-links">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
                <a href="gamers.html" class="nav-link"><i class="fas fa-users"></i> Gamers</a>
                <a href="market.html" class="nav-link"><i class="fas fa-store"></i> Market</a>
                <a href="xp.html" class="nav-link"><i class="fas fa-trophy"></i> XP</a>
            </div>

            <div class="user-menu">
                <a href="create-store.html" class="create-store-btn" id="createStoreBtn">
                    <i class="fas fa-plus"></i> Open Store
                </a>
                <a href="profile.html" id="profileLink">
                    <img src="images/default-avatar.jpg" alt="Profile" class="user-avatar" id="userAvatar">
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Back Button -->
        <a href="market.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Marketplace
        </a>

        <!-- Store Content -->
        <div id="storeContent"></div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC9jF-ocy6HjsVzWVVlAyXW-4aIFgA79-A",
            authDomain: "crypto-6517d.firebaseapp.com",
            projectId: "crypto-6517d",
            storageBucket: "crypto-6517d.firebasestorage.app",
            messagingSenderId: "60263975159",
            appId: "1:60263975159:web:bd53dcaad86d6ed9592bf2"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const storeContent = document.getElementById('storeContent');
        const userAvatar = document.getElementById('userAvatar');
        const createStoreBtn = document.getElementById('createStoreBtn');
        const backBtn = document.querySelector('.back-btn');

        // State
        let currentUser = null;
        let currentStore = null;
        let storeProducts = [];
        let currentTab = 'products';

        // Get store ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('id');

        if (!storeId) {
            window.location.href = 'market.html';
        }

        // Check authentication
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                updateUserUI(user);
                await checkUserStore(user.uid);
            }
            loadStore();
        });

        function updateUserUI(user) {
            if (user.photoURL) {
                userAvatar.src = user.photoURL;
            }
        }

        async function checkUserStore(userId) {
            try {
                const storeRef = doc(db, 'stores', userId);
                const storeSnap = await getDoc(storeRef);
                
                if (storeSnap.exists()) {
                    createStoreBtn.innerHTML = '<i class="fas fa-store"></i> My Store';
                    createStoreBtn.href = `store.html?id=${userId}`;
                }
            } catch (error) {
                console.log('Error checking store:', error);
            }
        }

        // Load store data
        async function loadStore() {
            try {
                showLoading();

                // Load store details
                const storeRef = doc(db, 'stores', storeId);
                const storeSnap = await getDoc(storeRef);

                if (!storeSnap.exists()) {
                    showError('Store not found');
                    return;
                }

                currentStore = {
                    id: storeSnap.id,
                    ...storeSnap.data()
                };

                // Load store products
                await loadStoreProducts();

                // Load owner details
                await loadOwnerDetails();

                // Render store
                renderStore();

            } catch (error) {
                console.error('Error loading store:', error);
                showError('Failed to load store');
            }
        }

        async function loadStoreProducts() {
            try {
                const productsRef = collection(db, 'products');
                const q = query(
                    productsRef,
                    where('storeId', '==', storeId),
                    where('status', '==', 'active'),
                    orderBy('createdAt', 'desc')
                );

                const querySnapshot = await getDocs(q);
                storeProducts = [];
                
                querySnapshot.forEach((doc) => {
                    storeProducts.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

            } catch (error) {
                console.error('Error loading store products:', error);
                storeProducts = [];
            }
        }

        async function loadOwnerDetails() {
            try {
                const ownerRef = doc(db, 'users', currentStore.ownerId);
                const ownerSnap = await getDoc(ownerRef);
                
                if (ownerSnap.exists()) {
                    currentStore.owner = ownerSnap.data();
                }
            } catch (error) {
                console.log('Error loading owner details:', error);
            }
        }

        function showLoading() {
            storeContent.innerHTML = `
                <div class="loading-skeleton">
                    <div class="skeleton-logo"></div>
                    <div class="skeleton-text" style="width: 60%;"></div>
                    <div class="skeleton-text" style="width: 40%;"></div>
                    <div class="skeleton-text" style="width: 80%;"></div>
                    <div class="skeleton-text" style="width: 50%;"></div>
                </div>
            `;
        }

        function showError(message) {
            storeContent.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle" style="color: var(--danger);"></i>
                    <h3>Error</h3>
                    <p>${message}</p>
                    <a href="market.html" class="back-btn" style="display: inline-block; margin-top: 20px;">
                        <i class="fas fa-arrow-left"></i> Back to Marketplace
                    </a>
                </div>
            `;
        }

        function renderStore() {
            // Get store logo
            const storeLogo = currentStore.logo || 'images/default-store.jpg';
            const storeThumbnail = currentStore.logoThumbnail || storeLogo;

            storeContent.innerHTML = `
                <!-- Store Header -->
                <div class="store-header">
                    <div class="store-cover"></div>
                    
                    <div class="store-info">
                        <img src="${storeThumbnail}" alt="${currentStore.storeName}" 
                             class="store-logo" onerror="this.src='images/default-store.jpg'">
                        
                        <div class="store-details">
                            <div class="store-name">
                                ${currentStore.storeName}
                                <span class="store-badge">
                                    <i class="fas fa-check-circle"></i> Verified Store
                                </span>
                            </div>
                            
                            <div class="store-meta">
                                <span class="store-meta-item">
                                    <i class="fas fa-tag"></i> ${currentStore.category || 'General Store'}
                                </span>
                                <span class="store-meta-item">
                                    <i class="fas fa-calendar"></i> Joined ${new Date(currentStore.createdAt?.toDate?.() || Date.now()).toLocaleDateString()}
                                </span>
                                <span class="store-meta-item">
                                    <i class="fas fa-star"></i> ${currentStore.rating || 'New'} (${currentStore.followers?.length || 0} followers)
                                </span>
                            </div>
                            
                            <div class="store-description">
                                ${currentStore.description || 'No description provided.'}
                            </div>
                            
                            <div class="store-stats">
                                <div class="stat-item">
                                    <div class="stat-value">${storeProducts.length}</div>
                                    <div class="stat-label">Products</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${currentStore.totalSales || 0}</div>
                                    <div class="stat-label">Sales</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${currentStore.followers?.length || 0}</div>
                                    <div class="stat-label">Followers</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="store-actions">
                            ${currentStore.whatsapp ? `
                                <a href="https://wa.me/${currentStore.whatsapp.replace('+', '')}" 
                                   target="_blank" class="contact-btn whatsapp">
                                    <i class="fab fa-whatsapp"></i> WhatsApp
                                </a>
                            ` : ''}
                            
                            ${currentStore.telegram ? `
                                <a href="https://t.me/${currentStore.telegram.replace('@', '')}" 
                                   target="_blank" class="contact-btn telegram">
                                    <i class="fab fa-telegram"></i> Telegram
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab ${currentTab === 'products' ? 'active' : ''}" data-tab="products">
                        <i class="fas fa-box"></i> Products (${storeProducts.length})
                    </button>
                    <button class="tab ${currentTab === 'about' ? 'active' : ''}" data-tab="about">
                        <i class="fas fa-info-circle"></i> About Store
                    </button>
                    <button class="tab ${currentTab === 'contact' ? 'active' : ''}" data-tab="contact">
                        <i class="fas fa-phone-alt"></i> Contact
                    </button>
                </div>

                <!-- Tab Content -->
                <div id="tabContent">
                    ${renderTabContent()}
                </div>
            `;

            // Add tab event listeners
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentTab = tab.dataset.tab;
                    
                    // Update active tab
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // Render tab content
                    document.getElementById('tabContent').innerHTML = renderTabContent();
                });
            });

            // Add product card click events
            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', () => {
                    window.location.href = `product.html?id=${card.dataset.productId}`;
                });
            });
        }

        function renderTabContent() {
            switch(currentTab) {
                case 'products':
                    return renderProductsTab();
                case 'about':
                    return renderAboutTab();
                case 'contact':
                    return renderContactTab();
                default:
                    return renderProductsTab();
            }
        }

        function renderProductsTab() {
            if (storeProducts.length === 0) {
                return `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>No Products Yet</h3>
                        <p>This store hasn't listed any products yet.</p>
                        ${currentUser && currentUser.uid === currentStore.ownerId ? `
                            <a href="create-product.html" class="create-store-btn" style="display: inline-block; margin-top: 20px;">
                                <i class="fas fa-plus"></i> Add Your First Product
                            </a>
                        ` : ''}
                    </div>
                `;
            }

            return `
                <div class="products-grid">
                    ${storeProducts.map(product => {
                        const hasDiscount = product.discount > 0;
                        const productImage = product.images && product.images.length > 0
                            ? (typeof product.images[0] === 'object' ? product.images[0].thumbnail || product.images[0].url : product.images[0])
                            : 'images/default-product.jpg';
                        
                        return `
                            <div class="product-card" data-product-id="${product.productId || product.id}">
                                <img src="${productImage}" alt="${product.name}" class="product-image"
                                     onerror="this.src='images/default-product.jpg'">
                                
                                ${product.status === 'new' ? '<span class="product-badge">NEW</span>' : ''}
                                ${hasDiscount ? `<span class="product-discount">-${product.discount}%</span>` : ''}
                                
                                <div class="product-info">
                                    <h3 class="product-name">${product.name}</h3>
                                    
                                    <div class="product-price">
                                        <span class="current-price">$${product.salePrice || product.price}</span>
                                        ${hasDiscount ? `<span class="original-price">$${product.originalPrice}</span>` : ''}
                                    </div>
                                    
                                    <div class="product-meta">
                                        <span><i class="fas fa-eye"></i> ${product.views || 0}</span>
                                        <span><i class="fas fa-heart"></i> ${product.likes?.length || 0}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderAboutTab() {
            return `
                <div class="about-section">
                    <h2 class="about-title">
                        <i class="fas fa-store-alt"></i> About ${currentStore.storeName}
                    </h2>
                    
                    <div class="about-text">
                        ${currentStore.description || 'No description provided.'}
                    </div>
                    
                    <div class="policies-section">
                        <h3 class="policies-title">
                            <i class="fas fa-file-alt"></i> Store Policies
                        </h3>
                        <div class="policies-text">
                            ${currentStore.policies || 'Standard store policies apply. Contact the seller for more information.'}
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
                        <i class="fas fa-calendar-alt"></i> Store created on ${new Date(currentStore.createdAt?.toDate?.() || Date.now()).toLocaleDateString()}
                    </div>
                </div>
            `;
        }

        function renderContactTab() {
            const hasWhatsapp = currentStore.whatsapp;
            const hasTelegram = currentStore.telegram;
            const hasAdditional = currentStore.additionalContact;

            return `
                <div class="contact-info">
                    <h2 class="contact-title">
                        <i class="fas fa-headset"></i> Contact Information
                    </h2>
                    
                    <div class="contact-list">
                        ${hasWhatsapp ? `
                            <div class="contact-item">
                                <div class="contact-icon">
                                    <i class="fab fa-whatsapp"></i>
                                </div>
                                <div class="contact-detail">
                                    <div class="contact-label">WhatsApp</div>
                                    <div class="contact-value">+${currentStore.whatsapp}</div>
                                </div>
                                <a href="https://wa.me/${currentStore.whatsapp.replace('+', '')}" 
                                   target="_blank" class="contact-action">
                                    <i class="fas fa-external-link-alt"></i> Chat
                                </a>
                            </div>
                        ` : ''}
                        
                        ${hasTelegram ? `
                            <div class="contact-item">
                                <div class="contact-icon">
                                    <i class="fab fa-telegram"></i>
                                </div>
                                <div class="contact-detail">
                                    <div class="contact-label">Telegram</div>
                                    <div class="contact-value">@${currentStore.telegram}</div>
                                </div>
                                <a href="https://t.me/${currentStore.telegram.replace('@', '')}" 
                                   target="_blank" class="contact-action">
                                    <i class="fas fa-external-link-alt"></i> Message
                                </a>
                            </div>
                        ` : ''}
                        
                        ${hasAdditional ? `
                            <div class="contact-item">
                                <div class="contact-icon">
                                    <i class="fas fa-envelope"></i>
                                </div>
                                <div class="contact-detail">
                                    <div class="contact-label">Additional Contact</div>
                                    <div class="contact-value">${currentStore.additionalContact}</div>
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="contact-item">
                            <div class="contact-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="contact-detail">
                                <div class="contact-label">Store Owner</div>
                                <div class="contact-value">${currentStore.ownerName || 'Store Owner'}</div>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="contact-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="contact-detail">
                                <div class="contact-label">Email</div>
                                <div class="contact-value">${currentStore.ownerEmail || 'Not provided'}</div>
                            </div>
                        </div>
                    </div>
                    
                    ${(!hasWhatsapp && !hasTelegram && !hasAdditional) ? `
                        <div class="empty-state" style="margin-top: 20px;">
                            <i class="fas fa-phone-slash"></i>
                            <p>No contact information provided.</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Update back button to preserve filter state
        const referrer = document.referrer;
        if (referrer.includes('market.html')) {
            backBtn.href = referrer;
        }
    </script>
</body>
</html>
