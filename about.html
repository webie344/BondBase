<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Battle Arena - Free Fire Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        #gameUI {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
            pointer-events: none;
        }
        
        #healthBar {
            width: 200px;
            height: 20px;
            background: rgba(255,0,0,0.3);
            border: 2px solid white;
            border-radius: 10px;
            overflow: hidden;
        }
        
        #healthFill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            transition: width 0.3s;
        }
        
        #score {
            font-size: 24px;
            margin-top: 10px;
            color: gold;
        }
        
        #ammo {
            font-size: 20px;
            margin-top: 10px;
            color: white;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            z-index: 200;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        
        #crosshair::before {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #crosshair::after {
            width: 2px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 50px;
            z-index: 100;
            font-size: 16px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        #controls span {
            margin: 0 15px;
            color: #00ff00;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 300;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid gold;
        }
        
        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: gold;
        }
        
        #restartBtn {
            padding: 15px 30px;
            font-size: 20px;
            background: linear-gradient(45deg, #ff0000, #ff6600);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s;
            margin-top: 20px;
        }
        
        #restartBtn:hover {
            transform: scale(1.1);
        }
        
        #muzzleFlash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,0,0.8), rgba(255,0,0,0));
            border-radius: 50%;
            z-index: 250;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameUI">
        <div>HEALTH</div>
        <div id="healthBar">
            <div id="healthFill"></div>
        </div>
        <div id="score">SCORE: 0</div>
        <div id="ammo">AMMO: 30/30</div>
    </div>
    
    <div id="crosshair"></div>
    <div id="muzzleFlash"></div>
    
    <div id="controls">
        <span>WASD</span> MOVE | <span>MOUSE</span> AIM | <span>CLICK</span> SHOOT | <span>R</span> RELOAD
    </div>
    
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <div id="finalScore" style="font-size: 32px; margin: 20px 0;">SCORE: 0</div>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>

    <!-- Import Three.js and required libraries -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // Game variables
        let scene, camera, renderer;
        let player, enemies = [];
        let bullets = [];
        let score = 0;
        let health = 100;
        let ammo = 30;
        let maxAmmo = 30;
        let gameActive = true;
        let enemySpawnInterval;
        let keys = {};
        let mouseX = 0, mouseY = 0;
        let lastShot = 0;
        const shotCooldown = 200; // ms
        
        // Initialize the game
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);
            
            // Create camera (first-person view)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Lighting
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            // Directional light (sun)
            const sunLight = new THREE.DirectionalLight(0xffeedd, 1);
            sunLight.position.set(10, 20, 5);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            scene.add(sunLight);
            
            // Ground with grass effect
            const groundGeometry = new THREE.CircleGeometry(50, 32);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x3a7e3a,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Add grid for better 3D effect
            const gridHelper = new THREE.GridHelper(100, 20, 0x00ff00, 0xffffff);
            gridHelper.position.y = -0.49;
            scene.add(gridHelper);
            
            // Create some trees/obstacles for cover
            createEnvironment();
            
            // Create player weapon (visible in first-person)
            createWeapon();
            
            // Start enemy spawning
            enemySpawnInterval = setInterval(spawnEnemy, 3000);
            
            // Event listeners
            document.addEventListener('keydown', (e) => keys[e.code] = true);
            document.addEventListener('keyup', (e) => keys[e.code] = false);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', shoot);
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyR') reload();
            });
            
            // Lock mouse for better FPS controls
            renderer.domElement.addEventListener('click', () => {
                renderer.domElement.requestPointerLock();
            });
            
            // Start game loop
            animate();
            
            // Update UI
            updateUI();
        }
        
        function createEnvironment() {
            // Create rocks and trees for cover
            const colors = [0x8B4513, 0xA0522D, 0x654321];
            
            for (let i = 0; i < 20; i++) {
                // Random obstacles
                const type = Math.random() > 0.5 ? 'rock' : 'tree';
                
                if (type === 'rock') {
                    const rockGroup = new THREE.Group();
                    
                    // Main rock body
                    const rockGeo = new THREE.DodecahedronGeometry(0.5 + Math.random() * 0.5);
                    const rockMat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.9 });
                    const rock = new THREE.Mesh(rockGeo, rockMat);
                    rock.castShadow = true;
                    rock.receiveShadow = true;
                    rockGroup.add(rock);
                    
                    // Position randomly but not too close to player start
                    let x, z;
                    do {
                        x = (Math.random() - 0.5) * 40;
                        z = (Math.random() - 0.5) * 40;
                    } while (Math.sqrt(x*x + z*z) < 5);
                    
                    rockGroup.position.set(x, 0, z);
                    scene.add(rockGroup);
                } else {
                    // Simple tree
                    const treeGroup = new THREE.Group();
                    
                    // Trunk
                    const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.5);
                    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                    trunk.position.y = 0.75;
                    trunk.castShadow = true;
                    trunk.receiveShadow = true;
                    treeGroup.add(trunk);
                    
                    // Leaves
                    const leavesGeo = new THREE.ConeGeometry(0.7, 1.2, 8);
                    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
                    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                    leaves.position.y = 1.5;
                    leaves.castShadow = true;
                    leaves.receiveShadow = true;
                    treeGroup.add(leaves);
                    
                    // Position
                    let x, z;
                    do {
                        x = (Math.random() - 0.5) * 40;
                        z = (Math.random() - 0.5) * 40;
                    } while (Math.sqrt(x*x + z*z) < 5);
                    
                    treeGroup.position.set(x, 0, z);
                    scene.add(treeGroup);
                }
            }
        }
        
        function createWeapon() {
            const weaponGroup = new THREE.Group();
            
            // Gun body
            const bodyGeo = new THREE.BoxGeometry(0.2, 0.2, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0x111111 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(0.3, -0.2, -0.4);
            body.castShadow = true;
            weaponGroup.add(body);
            
            // Barrel
            const barrelGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.6);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0.3, -0.2, -0.8);
            barrel.castShadow = true;
            weaponGroup.add(barrel);
            
            // Handle
            const handleGeo = new THREE.BoxGeometry(0.15, 0.3, 0.15);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.set(0.3, -0.35, -0.2);
            handle.castShadow = true;
            weaponGroup.add(handle);
            
            // Scope
            const scopeGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.15);
            const scopeMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const scope = new THREE.Mesh(scopeGeo, scopeMat);
            scope.rotation.z = Math.PI / 2;
            scope.position.set(0.3, -0.05, -0.1);
            scope.castShadow = true;
            weaponGroup.add(scope);
            
            scene.add(weaponGroup);
            player = weaponGroup;
        }
        
        function spawnEnemy() {
            if (!gameActive) return;
            
            const enemyGroup = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x330000 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.4;
            body.castShadow = true;
            body.receiveShadow = true;
            enemyGroup.add(body);
            
            // Head
            const headGeo = new THREE.SphereGeometry(0.2);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x333300 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.0;
            head.castShadow = true;
            head.receiveShadow = true;
            enemyGroup.add(head);
            
            // Gun
            const gunGeo = new THREE.BoxGeometry(0.1, 0.1, 0.4);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.3, 0.5, 0.2);
            gun.rotation.y = Math.PI / 4;
            gun.castShadow = true;
            enemyGroup.add(gun);
            
            // Position randomly around the player
            const angle = Math.random() * Math.PI * 2;
            const distance = 10 + Math.random() * 15;
            const x = Math.cos(angle) * distance;
            const z = Math.sin(angle) * distance;
            
            enemyGroup.position.set(x, 0, z);
            
            // Add health property
            enemyGroup.userData = { health: 30 };
            
            scene.add(enemyGroup);
            enemies.push(enemyGroup);
        }
        
        function onMouseMove(event) {
            if (document.pointerLockElement === renderer.domElement) {
                mouseX += event.movementX * 0.002;
                mouseY += event.movementY * 0.002;
                mouseY = Math.max(-1, Math.min(1, mouseY));
                
                // Rotate camera based on mouse
                camera.rotation.y = -mouseX;
                camera.rotation.x = -mouseY;
            }
        }
        
        function shoot() {
            if (!gameActive || ammo <= 0) return;
            
            const now = Date.now();
            if (now - lastShot < shotCooldown) return;
            
            lastShot = now;
            ammo--;
            updateUI();
            
            // Muzzle flash effect
            const flash = document.getElementById('muzzleFlash');
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 50);
            
            // Create bullet (visual effect)
            const bulletGeo = new THREE.SphereGeometry(0.05);
            const bulletMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            // Position bullet at camera
            bullet.position.copy(camera.position);
            
            // Direction from camera
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            
            bullet.userData = { direction, speed: 0.5, distance: 0 };
            scene.add(bullet);
            bullets.push(bullet);
            
            // Check for enemy hits (raycasting)
            const raycaster = new THREE.Raycaster(camera.position, direction);
            const enemyMeshes = enemies.map(e => e.children[0]); // Check body hits
            
            const intersects = raycaster.intersectObjects(enemyMeshes);
            
            if (intersects.length > 0) {
                const hitEnemy = intersects[0].object.parent;
                const index = enemies.indexOf(hitEnemy);
                
                if (index !== -1) {
                    hitEnemy.userData.health -= 10;
                    
                    // Flash effect on hit
                    hitEnemy.children.forEach(child => {
                        child.material.emissive.setHex(0x333300);
                        setTimeout(() => child.material.emissive.setHex(0x000000), 100);
                    });
                    
                    if (hitEnemy.userData.health <= 0) {
                        // Enemy killed
                        scene.remove(hitEnemy);
                        enemies.splice(index, 1);
                        score += 100;
                        updateUI();
                        
                        // Explosion effect
                        createExplosion(hitEnemy.position);
                    }
                }
            }
        }
        
        function createExplosion(position) {
            const particleCount = 20;
            const particles = [];
            
            for (let i = 0; i < particleCount; i++) {
                const particleGeo = new THREE.SphereGeometry(0.1);
                const particleMat = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0xff3300 });
                const particle = new THREE.Mesh(particleGeo, particleMat);
                
                particle.position.copy(position);
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.1 + Math.random() * 0.1;
                particle.userData = {
                    velocity: new THREE.Vector3(
                        Math.cos(angle) * speed,
                        Math.random() * speed,
                        Math.sin(angle) * speed
                    ),
                    life: 1.0
                };
                
                scene.add(particle);
                particles.push(particle);
            }
            
            // Remove particles after animation
            setTimeout(() => {
                particles.forEach(p => scene.remove(p));
            }, 500);
        }
        
        function reload() {
            if (gameActive) {
                ammo = maxAmmo;
                updateUI();
            }
        }
        
        function updateUI() {
            document.getElementById('score').textContent = `SCORE: ${score}`;
            document.getElementById('ammo').textContent = `AMMO: ${ammo}/${maxAmmo}`;
            document.getElementById('healthFill').style.width = `${health}%`;
            
            if (health <= 0) {
                gameOver();
            }
        }
        
        function gameOver() {
            gameActive = false;
            clearInterval(enemySpawnInterval);
            
            document.getElementById('finalScore').textContent = `SCORE: ${score}`;
            document.getElementById('gameOver').style.display = 'block';
            
            document.exitPointerLock();
        }
        
        function restart() {
            // Reset game state
            gameActive = true;
            health = 100;
            score = 0;
            ammo = 30;
            
            // Clear enemies
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            
            // Clear bullets
            bullets.forEach(b => scene.remove(b));
            bullets = [];
            
            // Reset camera
            camera.position.set(0, 2, 5);
            camera.rotation.set(0, 0, 0);
            
            // Hide game over screen
            document.getElementById('gameOver').style.display = 'none';
            
            // Update UI
            updateUI();
            
            // Restart spawning
            enemySpawnInterval = setInterval(spawnEnemy, 3000);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (gameActive) {
                // Player movement (WASD)
                const speed = 0.1;
                const forward = new THREE.Vector3(0, 0, -1);
                forward.applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                
                const right = new THREE.Vector3(1, 0, 0);
                right.applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();
                
                if (keys['KeyW']) {
                    camera.position.add(forward.clone().multiplyScalar(speed));
                }
                if (keys['KeyS']) {
                    camera.position.add(forward.clone().multiplyScalar(-speed));
                }
                if (keys['KeyA']) {
                    camera.position.add(right.clone().multiplyScalar(-speed));
                }
                if (keys['KeyD']) {
                    camera.position.add(right.clone().multiplyScalar(speed));
                }
                
                // Update weapon position (follow camera)
                if (player) {
                    player.position.copy(camera.position);
                    player.rotation.copy(camera.rotation);
                    player.position.add(new THREE.Vector3(0, -0.2, 0.5));
                }
                
                // Update bullets
                bullets.forEach((bullet, index) => {
                    bullet.position.add(bullet.userData.direction.clone().multiplyScalar(bullet.userData.speed));
                    bullet.userData.distance += bullet.userData.speed;
                    
                    if (bullet.userData.distance > 50) {
                        scene.remove(bullet);
                        bullets.splice(index, 1);
                    }
                });
                
                // Enemy AI (move towards player)
                enemies.forEach(enemy => {
                    const direction = new THREE.Vector3().subVectors(camera.position, enemy.position);
                    direction.y = 0;
                    
                    if (direction.length() > 5) {
                        direction.normalize();
                        enemy.position.add(direction.multiplyScalar(0.02));
                    }
                    
                    // Make enemy face player
                    enemy.lookAt(camera.position);
                    
                    // Simple enemy shooting (damage player if close)
                    if (direction.length() < 8) {
                        if (Math.random() < 0.01) { // 1% chance per frame
                            health -= 5;
                            updateUI();
                            
                            // Damage effect
                            document.body.style.backgroundColor = 'rgba(255,0,0,0.3)';
                            setTimeout(() => document.body.style.backgroundColor = '', 100);
                        }
                    }
                });
            }
            
            renderer.render(scene, camera);
        }
        
        // Event listeners
        document.getElementById('restartBtn').addEventListener('click', restart);
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start the game
        init();
    </script>
</body>
</html>
