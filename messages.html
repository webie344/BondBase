<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - BondBase</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Your existing stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="scrol-fix.css">
    <link rel="stylesheet" href="chat.css">

    <style>
        /* ─── BASE ─── */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary, #0e1014);
            color: var(--text-primary, #f0f2f5);
            margin: 0;
            padding: 0;
            overflow: hidden; /* prevent body scroll — panels scroll internally */
        }

        .feather {
            width: 20px; height: 20px;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none;
        }

        /* ═══════════════════════════════════════════════════════
           TOP NAVBAR  (same as other pages)
        ═══════════════════════════════════════════════════════ */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 300;
            height: 56px;
            background: rgba(14,16,20,0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color, rgba(255,255,255,0.07));
            display: flex;
            align-items: center;
            padding: 0 1.25rem;
            gap: 1rem;
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary, #f0f2f5);
            text-decoration: none;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        .nav-logo span { color: var(--primary, #ff4b6e); }

        /* Nav links (horizontal, right-aligned) */
        .nav-links-row {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-left: auto;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-light, #7a8090);
            font-size: 0.68rem;
            gap: 0.15rem;
            padding: 0.3rem 0.55rem;
            border-radius: 9px;
            transition: color 0.2s;
            position: relative;
        }

        .nav-link:hover, .nav-link.active { color: var(--primary, #ff4b6e); }
        .nav-link .feather { width: 15px; height: 15px; stroke: currentColor; }

        .message-count, .notification-badge {
            position: absolute;
            top: -3px; right: -3px;
            background: var(--primary, #ff4b6e);
            color: white;
            border-radius: 50%;
            width: 15px; height: 15px;
            font-size: 9px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg-primary, #0e1014);
        }

        .nav-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
            margin-left: auto;
        }

        .bar { width: 20px; height: 2px; background: var(--text-primary, #f0f2f5); border-radius: 2px; }

        /* mobile nav menu */
        .nav-menu-mobile {
            display: none;
            position: fixed;
            top: 56px; left: 0; right: 0;
            background: rgba(14,16,20,0.97);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color, rgba(255,255,255,0.07));
            z-index: 299;
            padding: 0.75rem 0;
            flex-direction: column;
        }

        .nav-menu-mobile.open { display: flex; }

        .nav-menu-mobile a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 1.5rem;
            text-decoration: none;
            color: var(--text-light, #7a8090);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-menu-mobile a:hover { color: var(--primary, #ff4b6e); }
        .nav-menu-mobile a .feather { width: 18px; height: 18px; stroke: currentColor; }

        @media (max-width: 680px) {
            .nav-links-row { display: none; }
            .nav-toggle { display: flex; }
        }

        /* ═══════════════════════════════════════════════════════
           SPA LAYOUT  — sits below the 56px navbar
        ═══════════════════════════════════════════════════════ */
        .spa-layout {
            position: fixed;
            top: 56px; left: 0; right: 0; bottom: 0;
            display: flex;
            overflow: hidden;
        }

        /* ── LEFT PANEL: conversation list ── */
        #messagesPanel {
            width: 360px;
            min-width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color, rgba(255,255,255,0.07));
            background: var(--bg-secondary, #14171c);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem 1.25rem 0.75rem;
            border-bottom: 1px solid var(--border-color, rgba(255,255,255,0.07));
            flex-shrink: 0;
        }

        .panel-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary, #f0f2f5);
            margin: 0 0 0.75rem;
        }

        #messageSearch {
            width: 100%;
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color, rgba(255,255,255,0.07));
            border-radius: 20px;
            color: var(--text-primary, #f0f2f5);
            font-size: 0.88rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        #messageSearch:focus { border-color: var(--primary, #ff4b6e); }
        #messageSearch::placeholder { color: var(--text-light, #7a8090); }

        #messagesList {
            flex: 1;
            overflow-y: auto;
            padding: 0.25rem 0;
        }

        /* conversation thread cards */
        .message-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 1.25rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            border-radius: 0;
            transition: background 0.15s;
            position: relative;
        }

        .message-card:hover { background: rgba(255,255,255,0.05); }

        .message-card.active {
            background: rgba(255,255,255,0.05);
            border-left: 3px solid var(--primary, #ff4b6e);
        }

        .message-card img {
            width: 60px; height: 52px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .message-content { flex: 1; min-width: 0; }

        .message-content h3 {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary, #f0f2f5);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 0 0 3px;
        }

        .message-content p {
            font-size: 0.78rem;
            color: var(--text-light, #7a8090);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }

        .message-time {
            font-size: 0.7rem !important;
            color: var(--text-light, #7a8090) !important;
            font-weight: 400 !important;
            flex-shrink: 0;
            margin-left: 9px;
        }

        .unread-count {
            background: var(--primary, #ff4b6e);
            color: white;
            border-radius: 50%;
            min-width: 19px; height: 19px;
            font-size: 0.68rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding: 0 3px;
            flex-shrink: 0;
        }

        .online-status {
            font-size: 0.82rem !important;
            color: var(--text-light, #7a8090) !important;
            display: flex !important;
            align-items: center !important;
            gap: 4px !important;
        }

        .online-status .feather { width: 8px !important; height: 8px !important; }

        /* ── RIGHT PANEL: chat ── */
        #chatPanel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: url('darkwallpaper.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        /* empty state */
        .chat-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 1rem;
            text-align: center;
            padding: 2rem;
            color: var(--text-light, #7a8090);
            background: rgba(14,16,20,0.6);
            backdrop-filter: blur(8px);
        }

        .chat-empty-state .empty-icon {
            font-size: 3.5rem;
            opacity: 0.3;
        }

        .chat-empty-state h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary, #c8cdd6);
            margin: 0;
        }

        .chat-empty-state p {
            font-size: 0.88rem;
            margin: 0;
        }

        /* chat content area — hidden until a chat is opened */
        .chat-content {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #chatPanel.active .chat-empty-state { display: none; }
        #chatPanel.active .chat-content     { display: flex; }

        /* ─── CHAT HEADER ─── */
        .chat-header {
            display: flex !important;
            align-items: center !important;
            padding: 12px 20px !important;
            background: rgba(255,255,255,0.1) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(255,255,255,0.15) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important;
            flex-shrink: 0 !important;
            gap: 10px;
        }

        /* back button (visible on mobile only) */
        #backToMessages {
            color: var(--text-primary, #f0f2f5) !important;
            background: rgba(255,255,255,0.15) !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            border-radius: 50% !important;
            width: 38px !important; height: 38px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
            flex-shrink: 0 !important;
        }

        #backToMessages:hover {
            background: rgba(255,255,255,0.25) !important;
            color: var(--primary, #ff4b6e) !important;
        }

        #backToMessages .feather { width: 18px !important; height: 18px !important; stroke: currentColor !important; }

        /* Hide back button on desktop — no need to slide back */
        @media (min-width: 769px) {
            #backToMessages { display: none !important; }
        }

        .chat-partner-info {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            flex: 1 !important;
            min-width: 0;
        }

        #chatPartnerImage {
            width: 44px !important;
            height: 44px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            border: 2px solid var(--primary, #ff4b6e) !important;
            flex-shrink: 0;
        }

        .chat-partner-info > div { flex: 1; min-width: 0; }

        #chatPartnerName {
            font-size: 1rem !important;
            font-weight: 600 !important;
            margin: 0 0 2px !important;
            color: var(--text-primary, #f0f2f5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #chatPartnerStatus {
            font-size: 0.8rem !important;
            color: var(--text-light, #7a8090) !important;
            display: flex !important;
            align-items: center !important;
            gap: 5px !important;
            margin: 0 !important;
        }

        #chatPartnerStatus .feather { width: 8px !important; height: 8px !important; }

        /* call buttons */
        .call-controls {
            display: flex !important;
            gap: 8px !important;
            margin-left: auto !important;
            flex-shrink: 0;
        }

        .call-btn {
            background: rgba(255,255,255,0.1) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            border-radius: 50% !important;
            width: 38px !important; height: 38px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
            color: var(--text-primary, #f0f2f5) !important;
        }

        .call-btn:hover {
            background: var(--primary, #ff4b6e) !important;
            color: white !important;
            transform: scale(1.08) !important;
        }

        .call-btn .feather { width: 17px !important; height: 17px !important; stroke: currentColor !important; }

        /* ─── MESSAGES AREA ─── */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
        }

        /* ── WhatsApp-style message spacing ──
           Consecutive same-side messages: tight (2px)
           Side change: bigger gap (10px) — only the incoming
           message gets the top gap so it feels natural        */
        .chat-messages .message {
            margin-bottom: 2px;
              /* subtle, not pill-shaped */
        }

        /* gap before a received message that follows a sent one */
        .chat-messages .message.sent + .message.received {
            margin-top: 10px;
        }

        /* gap before a sent message that follows a received one */
        .chat-messages .message.received + .message.sent {
            margin-top: 10px;
        }

        /* no hover tint on message bubbles in the chat panel */
        .chat-messages .message:hover {
            background: unset;
        }

        /* ─── INPUT AREA ─── */
        .chat-input-container {
            padding: 12px 16px !important;
            background: rgba(255,255,255,0.1) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border-top: 1px solid rgba(255,255,255,0.15) !important;
            flex-shrink: 0;
        }

        .typing-indicator {
            background: var(--bg-card, #1c2028);
            color: var(--text-secondary, #c8cdd6);
            border: 1px solid var(--border-color, rgba(255,255,255,0.07));
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 0.82rem;
            margin-bottom: 8px;
            display: none;
        }

        /* reply preview */
        .reply-preview {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.06);
            border-left: 3px solid var(--primary, #ff4b6e);
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color, rgba(255,255,255,0.07));
        }

        .reply-preview-content { flex: 1; margin-left: 10px; overflow: hidden; }
        .reply-preview-name { font-size: 12px; font-weight: 700; color: white; margin-bottom: 2px; }
        .reply-preview-text { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-secondary, #c8cdd6); }
        .reply-preview-cancel { background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 16px; padding: 5px; transition: color 0.2s; }
        .reply-preview-cancel:hover { color: var(--primary, #ff4b6e); }

        /* voice note recording indicator */
        .voice-note-indicator {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: var(--bg-card, #1c2028);
            border-radius: 25px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color, rgba(255,255,255,0.07));
        }

        .voice-note-timer { font-size: 14px; color: var(--text-primary, #f0f2f5); font-weight: 700; }
        .voice-note-controls { display: flex; gap: 10px; }

        .voice-note-btn {
            background: none; border: none;
            color: var(--primary, #ff4b6e);
            cursor: pointer; padding: 5px 10px; border-radius: 50%;
            transition: background 0.2s;
        }

        .voice-note-btn:hover { background: rgba(255,75,110,0.1); }
        .voice-note-btn .feather { width: 16px; height: 16px; stroke: currentColor; }

        /* main chat input row */
        .chat-input {
            display: flex !important;
            align-items: center !important;
            background: rgba(255,255,255,0.15) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            border-radius: 24px !important;
            padding: 6px 14px !important;
            gap: 6px !important;
            transition: all 0.2s !important;
        }

        .chat-input:focus-within {
            border-color: rgba(255,75,110,0.5) !important;
            box-shadow: 0 0 0 2px rgba(255,75,110,0.12) !important;
            background: rgba(255,255,255,0.2) !important;
        }

        .input-controls-left, .input-controls-right {
            display: flex !important;
            align-items: center !important;
            gap: 2px !important;
            flex-shrink: 0 !important;
        }

        .inside-input-btn {
            background: none !important; border: none !important;
            color: var(--text-secondary, #c8cdd6) !important;
            cursor: pointer !important; padding: 7px !important;
            border-radius: 50% !important;
            transition: all 0.2s !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            width: 34px !important; height: 34px !important;
        }

        .inside-input-btn:hover { background: rgba(255,255,255,0.2) !important; color: var(--primary, #ff4b6e) !important; }
        .inside-input-btn .feather { width: 19px !important; height: 19px !important; stroke: currentColor !important; }

        #messageInput {
            flex: 1 !important;
            background: transparent !important;
            border: none !important;
            color: var(--text-primary, #f0f2f5) !important;
            font-size: 0.92rem !important;
            font-family: 'Inter', sans-serif !important;
            padding: 7px 0 !important;
            outline: none !important;
            min-height: 22px !important;
            max-height: 120px !important;
        }

        #messageInput::placeholder { color: var(--text-light, #7a8090); }

        .send-btn {
            background: var(--primary, #ff4b6e) !important;
            color: white !important; border: none !important;
            border-radius: 50% !important; padding: 0 !important;
            width: 34px !important; height: 34px !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            flex-shrink: 0 !important;
        }

        .send-btn:hover:not(:disabled) { background: var(--primary-dark, #cc2a4a) !important; transform: scale(1.05) !important; }
        .send-btn:active:not(:disabled) { transform: scale(0.95) !important; }
        .send-btn:disabled { background: var(--border-color, rgba(255,255,255,0.1)) !important; cursor: not-allowed !important; }
        .send-btn .feather { width: 16px !important; height: 16px !important; stroke: white !important; stroke-width: 2.5 !important; }

        .game-icon-btn {
            background: none !important; border: none !important;
            color: var(--text-secondary, #c8cdd6) !important;
            cursor: pointer !important; padding: 7px !important;
            border-radius: 50% !important;
            transition: all 0.2s !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            width: 34px !important; height: 34px !important;
            font-size: 17px !important;
        }

        .game-icon-btn:hover { background: rgba(255,255,255,0.2) !important; }

        /* ─── REACTION PICKER ─── */
        #reactionPicker {
            display: none !important;
        }

        body.chat-page #reactionPicker {
            display: none !important;
            position: fixed !important;
            bottom: 0 !important; left: 0 !important; right: 0 !important;
            background: var(--bg-primary, #0e1014) !important;
            border-radius: 20px 20px 0 0 !important;
            padding: 20px 15px 30px !important;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.4) !important;
            z-index: 1001 !important;
            border: 1px solid var(--border-color, rgba(255,255,255,0.07)) !important;
            border-bottom: none !important;
            max-width: 100vw !important;
            transform: translateY(100%) !important;
            transition: transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275) !important;
            pointer-events: none !important;
            flex-wrap: wrap !important;
            justify-content: center !important;
            gap: 15px !important;
        }

        body.chat-page #reactionPicker[style*="display: flex"] {
            transform: translateY(0) !important;
            pointer-events: auto !important;
            display: flex !important;
        }

        body.chat-page #reactionPicker .reaction-emoji {
            font-size: 30px !important;
            cursor: pointer;
            padding: 10px !important;
            min-width: 48px !important; min-height: 48px !important;
            border-radius: 50%;
            display: flex !important; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05);
            transition: all 0.15s;
        }

        body.chat-page #reactionPicker .reaction-emoji:hover { transform: scale(1.2); background: rgba(255,255,255,0.1); }

        /* ─── MESSAGE REACTIONS ─── */
        .message-reactions {
            display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap;
        }

        .reaction {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color, rgba(255,255,255,0.07));
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 12px;
            display: flex; align-items: center; gap: 2px;
        }

        .reaction-count { font-size: 10px; color: var(--text-secondary, #c8cdd6); }

        /* ─── MESSAGE TIMESTAMP ─── */
        .message-content {
            display: flex !important;
            flex-wrap: wrap !important;
            align-items: baseline !important;
            gap: 4px !important;
        }

        .message-text { display: inline !important; }

        .message-time {
            display: inline-flex !important;
            align-items: center !important;
            white-space: nowrap !important;
            margin-left: auto !important;
            font-size: 0.68rem !important;
            opacity: 0.7 !important;
            flex-shrink: 0 !important;
        }

        .message.sent .message-time     { color: rgba(255,255,255,0.8) !important; }
        .message.received .message-time { color: var(--text-light, #7a8090) !important; }

        .message.sending .message-time {
            font-style: italic;
            color: var(--text-light, #7a8090);
        }

        /* reply indicators inside messages */
        .reply-indicator {
            font-size: 12px;
            color: var(--primary, #ff4b6e);
            margin-bottom: 4px;
            display: flex; align-items: center; gap: 4px;
        }

        .reply-message-preview {
            background: rgba(255,255,255,0.05);
            border-left: 2px solid var(--primary, #ff4b6e);
            padding: 4px 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            font-size: 12px;
            max-width: 200px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--text-secondary, #c8cdd6);
        }

        /* context menu */
        .message-context-menu {
            position: absolute;
            background: var(--bg-card, #1c2028);
            border-radius: 8px;
            box-shadow: var(--shadow-lg, 0 10px 40px rgba(0,0,0,0.5));
            z-index: 100; padding: 8px 0; display: none;
            border: 1px solid var(--border-color, rgba(255,255,255,0.07));
        }

        .context-menu-item {
            padding: 10px 16px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; color: var(--text-primary, #f0f2f5);
        }

        .context-menu-item:hover { background: rgba(255,255,255,0.05); }

        .message-swipe-action {
            position: absolute; top: 50%; left: 15px;
            transform: translateY(-50%);
            background: var(--primary, #ff4b6e); color: white;
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }

        /* voice note player */
        .voice-message-play-btn {
            z-index: 10; pointer-events: auto;
        }

        .voice-message-controls { pointer-events: none; }
        .voice-message-controls > * { pointer-events: auto; }

        /* ═══════════════════════════════════════════════════════
           MOBILE LAYOUT — panels stack, chat slides in over list
        ═══════════════════════════════════════════════════════ */
        @media (max-width: 768px) {
            #messagesPanel {
                width: 100%;
                position: absolute; inset: 0;
                z-index: 10;
                transition: transform 0.3s ease;
            }

            #messagesPanel.chat-open {
                transform: translateX(-100%);
                pointer-events: none;
            }

            #chatPanel {
                position: absolute; inset: 0;
                z-index: 20;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            }

            #chatPanel.active { transform: translateX(0); }

            .chat-messages { padding: 12px; }

            .chat-header { padding: 10px 14px !important; }

            .chat-input-container { padding: 10px 12px !important; }

            .chat-input { padding: 4px 12px !important; }

            .inside-input-btn, .game-icon-btn {
                width: 30px !important; height: 30px !important; padding: 5px !important;
            }

            .inside-input-btn .feather { width: 17px !important; height: 17px !important; }

            .send-btn { width: 30px !important; height: 30px !important; }
            .send-btn .feather { width: 15px !important; height: 15px !important; }

            #messageInput { font-size: 0.88rem !important; }
            #chatPartnerImage { width: 40px !important; height: 40px !important; }
        }

        @media (max-width: 480px) {
            body.chat-page #reactionPicker {
                padding: 12px 10px 20px !important;
                border-radius: 15px 15px 0 0 !important;
                gap: 10px !important;
            }

            body.chat-page #reactionPicker .reaction-emoji {
                font-size: 26px !important;
                min-width: 40px !important; min-height: 40px !important;
                padding: 8px !important;
            }
        }

        /* scrollbar */
        #messagesList::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar { width: 4px; }
        #messagesList::-webkit-scrollbar-track,
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        #messagesList::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,75,110,0.25); border-radius: 4px; }

        /* no-messages placeholder */
        .no-messages {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-light, #7a8090);
            font-size: 0.88rem;
        }
    </style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Feather icons
    if (typeof feather !== 'undefined') feather.replace();

    // Mark body so reaction picker CSS activates
    document.body.classList.add('chat-page');

    // ── Mobile nav toggle ──
    const toggle = document.getElementById('mobile-menu');
    const mobileMenu = document.getElementById('mobileNavMenu');
    if (toggle && mobileMenu) {
        toggle.addEventListener('click', () => mobileMenu.classList.toggle('open'));
        document.addEventListener('click', (e) => {
            if (!toggle.contains(e.target) && !mobileMenu.contains(e.target)) {
                mobileMenu.classList.remove('open');
            }
        });
    }

    // Mobile logout button mirrors the main one
    const logoutMobile = document.getElementById('logoutBtnMobile');
    const logoutMain   = document.getElementById('logoutBtn');
    if (logoutMobile && logoutMain) {
        logoutMobile.addEventListener('click', (e) => {
            e.preventDefault();
            logoutMain.click();
        });
    }

    // ── Reaction picker: slide up / close on outside click ──
    const reactionPicker = document.getElementById('reactionPicker');

    if (reactionPicker) {
        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.attributeName === 'style') {
                    if (reactionPicker.style.display === 'flex') {
                        const closeOnClick = function (e) {
                            if (!reactionPicker.contains(e.target)) {
                                reactionPicker.style.display = 'none';
                                document.removeEventListener('click', closeOnClick);
                            }
                        };
                        setTimeout(() => document.addEventListener('click', closeOnClick), 10);
                    }
                }
            });
        });

        observer.observe(reactionPicker, { attributes: true });
    }

    // Close reaction picker on Escape
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && reactionPicker && reactionPicker.style.display === 'flex') {
            reactionPicker.style.display = 'none';
        }
    });

    // ── Game invite button ──
    const gameBtn = document.getElementById('gameInviteBtn');
    if (gameBtn) {
        gameBtn.addEventListener('click', function () {
            const partnerId   = window.chatPartnerId;
            const partnerName = document.getElementById('chatPartnerName')?.textContent || 'Opponent';
            if (partnerId && window.gameManager) {
                window.gameManager.showGameSelectionModal(partnerId, partnerName);
            }
        });
    }
});

// Exposed for game.js compatibility
function openGameSelection() {
    const urlParams    = new URLSearchParams(window.location.search);
    const partnerId    = urlParams.get('id') || window.chatPartnerId;
    const partnerName  = document.getElementById('chatPartnerName')?.textContent || 'Opponent';
    if (partnerId && window.gameManager) {
        window.gameManager.showGameSelectionModal(partnerId, partnerName);
    } else {
        alert('Please open a chat first or wait for the game system to load');
    }
}
</script>
